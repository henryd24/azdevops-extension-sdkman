# Valida las tareas en agentes de Azure Pipelines (Linux, macOS y Windows).
# Ejecuta los bundles tal como los empaqueta la extensión (scripts/run-task.js); el agente interpreta los
# ##vso que imprimen (PATH, variables, resultado). El .vsix final lo genera GitHub Actions.
# macOS y Windows necesitan un paso de prerrequisitos (bash 4+, zip): ver README.
# Aún no se ha ejecutado en Azure Pipelines (solo en los mismos runners vía GitHub Actions: validate-tasks.yml).
# Seguridad: `pr: none`. Una build de PR de GitHub ejecuta el YAML del propio PR (el merge de origen y destino), así que un fork
# podría cambiar qué se ejecuta; la validación de PR la hace GitHub Actions (sin secretos, token de solo lectura). Este pipeline solo
# corre por push a trunk y a mano. Además, los cambios que no afectan al código no lo lanzan.
trigger:
  branches:
    include: [trunk]
  paths:
    exclude:
      - "**/*.md"
      - docs
      - images
      - LICENSE
      - .gitignore
      - .github

pr: none

variables:
  NODE_VERSION: 20.x

stages:
  - stage: Build
    jobs:
      - job: build
        displayName: Test and package tasks
        pool:
          vmImage: ubuntu-latest
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: $(NODE_VERSION)
          - script: npm ci
            displayName: Install
          - script: npm test
            displayName: Unit tests
          - script: npm run typecheck
            displayName: Typecheck
          - script: npm run package:tasks
            displayName: Bundle tasks (ncc)
          - publish: tasks
            artifact: tasks
            displayName: Publish bundled tasks

  - stage: Validate
    dependsOn: Build
    jobs:
      - job: validate
        displayName: Validate on
        strategy:
          maxParallel: 3
          matrix:
            linux:
              vmImage: ubuntu-latest
            macos:
              vmImage: macOS-latest
            windows:
              vmImage: windows-latest
        pool:
          vmImage: $(vmImage)
        variables:
          TASKS_DIR: $(Pipeline.Workspace)/tasks
        steps:
          - checkout: self
          - task: NodeTool@0
            inputs:
              versionSpec: $(NODE_VERSION)
          - download: current
            artifact: tasks

          # --- Prerrequisitos documentados en el README (verificados en los runners hospedados con GitHub Actions)
          # macOS trae solo bash 3.2; SDKMAN exige >= 4. Con backticks, porque Azure trataría $(...) como macro.
          # `set -e`: si brew falla, el paso falla (no se publica un PATH inexistente).
          - script: |
              set -e
              brew install bash
              BREW_BIN=`brew --prefix`/bin
              "$BREW_BIN/bash" --version | head -1
              echo "##vso[task.prependpath]$BREW_BIN"
            displayName: Prerequisite - bash 4+ (macOS)
            condition: and(succeeded(), eq(variables['Agent.OS'], 'Darwin'))
          # Git Bash de windows-latest no trae zip (unzip y curl sí). PowerShell en vez de cmd: en un `script:` de Windows
          # (un .cmd temporal) solo cuenta el código de salida de la última línea y un fallo intermedio pasaría desapercibido.
          - powershell: |
              & C:\msys64\usr\bin\pacman.exe -S --noconfirm zip
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              $git = 'C:\Program Files\Git\usr\bin'
              Copy-Item C:\msys64\usr\bin\zip.exe "$git\zip.exe" -Force
              if (-not (Test-Path "$git\msys-bz2-1.dll")) { Copy-Item C:\msys64\usr\bin\msys-bz2-1.dll $git }
              & 'C:\Program Files\Git\bin\bash.exe' -c 'command -v zip unzip curl'
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            displayName: Prerequisite - zip in Git Bash (Windows)
            condition: and(succeeded(), eq(variables['Agent.OS'], 'Windows_NT'))

          # Los comandos van con "\n" literal: run-task.js lo convierte en salto de línea (%0A lo interpretaría cmd.exe).
          # --- SdkmanSetup
          - script: node scripts/run-task.js sdkman-setup
            name: sdkmansetup
            displayName: SdkmanSetup
          - script: node scripts/expect.js "bash -c 'source $SDKMAN_DIR/bin/sdkman-init.sh && sdk version'" "script:"
            displayName: SDKMAN_DIR is usable from a script step
            condition: and(succeeded(), ne(variables['Agent.OS'], 'Windows_NT'))

          # --- SdkmanInstall: dos JDK (el primero activo) y maven
          - script: node scripts/run-task.js sdkman-install "candidates=java 21.0.5-tem\njava 17.0.13-tem\nmaven 3.9.9"
            name: sdkmaninstall
            displayName: SdkmanInstall java 21 + 17, maven
          # Los agentes traen su propio Java/Maven: solo pasan si el PATH de SDKMAN se antepone.
          - script: node scripts/expect.js "java -version" "21.0.5"
            displayName: Active java is 21
          - script: 'node scripts/expect.js "mvn -v" "Java version: 21.0.5"'
            displayName: maven runs on the active JDK (JAVA_HOME)
          - script: node scripts/run-task.js sdkman-install "candidates=java 21.0.5-tem"
            displayName: SdkmanInstall is idempotent

          # --- Ejemplos de la documentación: Java + Maven y Java + Gradle (proyectos mínimos en tests/fixtures)
          - script: node scripts/expect.js "mvn -B -f tests/fixtures/maven-app/pom.xml package" "BUILD SUCCESS"
            displayName: Example - Maven builds with the active JDK
          - script: node scripts/expect.js "java -cp tests/fixtures/maven-app/target/classes demo.App" "Hello from Java 21.0.5"
            displayName: Example - the Maven build runs on Java 21
          - script: node scripts/run-task.js sdkman-install "candidates=gradle 8.11.1"
            displayName: SdkmanInstall gradle 8.11.1
          - script: node scripts/expect.js "gradle --no-daemon -p tests/fixtures/gradle-app build" "BUILD SUCCESSFUL"
            displayName: Example - Gradle builds with the active JDK

          # --- SdkmanEnv: el .sdkmanrc del fixture (java 17 + maven) manda sobre lo anterior
          - script: node scripts/run-task.js sdkman-env sdkmanrcPath=tests/fixtures/sample/.sdkmanrc
            displayName: SdkmanEnv (.sdkmanrc)
          - script: node scripts/expect.js "java -version" "17.0.13"
            displayName: Active java is 17 (from .sdkmanrc)

          # --- SdkmanRun: modo sdk y modo shell (el shell ve el mismo JAVA_HOME que los pasos siguientes)
          - script: node scripts/run-task.js sdkman-run "commands=version\nhome java 21.0.5-tem"
            displayName: SdkmanRun (sdk mode)
          - script: node scripts/run-task.js sdkman-run mode=shell "commands=java -version\nmvn -v"
            displayName: SdkmanRun (shell mode)

          # --- Fase 6: offline (la API ni se consulta) y carpeta local como versión
          - script: node scripts/run-task.js sdkman-install offline=true candidatesApi=http://127.0.0.1:1 "candidates=java 21.0.5-tem"
            displayName: SdkmanInstall offline uses what is on disk
          - script: node scripts/run-task.js sdkman-install "candidates=java 21-local $SDKMAN_DIR/candidates/java/21.0.5-tem"
            displayName: SdkmanInstall local folder as a version
            condition: and(succeeded(), ne(variables['Agent.OS'], 'Windows_NT'))

      # Ejemplo de caché del README: Cache@2 sobre SDKMAN_DIR. En la segunda ejecución con la misma clave el job no debe
      # descargar nada (los JDK ya están en disco). Solo Linux: es una comprobación de la caché, no de cada sistema operativo.
      - job: cache_example
        displayName: README caching example (Linux)
        pool:
          vmImage: ubuntu-latest
        variables:
          TASKS_DIR: $(Pipeline.Workspace)/tasks
          SDKMAN_DIR: $(Pipeline.Workspace)/.sdkman
        steps:
          - checkout: self
          - task: NodeTool@0
            inputs:
              versionSpec: $(NODE_VERSION)
          - download: current
            artifact: tasks
          - task: Cache@2
            inputs:
              key: 'sdkman | "$(Agent.OS)" | "java 21.0.5-tem maven 3.9.9"'
              path: $(SDKMAN_DIR)
              cacheHitVar: SDKMAN_CACHE_HIT
            displayName: Restore SDKMAN_DIR
          - script: |
              set -o pipefail
              node scripts/run-task.js sdkman-install "candidates=java 21.0.5-tem\nmaven 3.9.9" 2>&1 | tee "$(Agent.TempDirectory)/install.log"
            displayName: SdkmanInstall
          - script: |
              grep -q "already installed" "$(Agent.TempDirectory)/install.log"
              ! grep -q "Downloading: java" "$(Agent.TempDirectory)/install.log"
            displayName: Cache hit means nothing was downloaded
            condition: and(succeeded(), eq(variables['SDKMAN_CACHE_HIT'], 'true'))
          - script: node scripts/expect.js "mvn -B -f tests/fixtures/maven-app/pom.xml package" "BUILD SUCCESS"
            displayName: The cached toolchain builds the Maven example
