name: Validate tasks

# Ejecuta los bundles de las tareas en runners reales (las mismas imágenes que los agentes hospedados de Azure Pipelines)
# y aplica con scripts/apply-vso.js lo que el agente haría con los ##vso. Instala antes los prerrequisitos documentados en
# el README: bash 4+ en macOS y zip en Git Bash de Windows.
on:
  push:
    branches: ["claude/**", trunk]
    paths:
      - "src/**"
      - "scripts/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/validate-tasks.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      # `runner` no existe en el contexto del env a nivel de job: se define aquí.
      - run: echo "LOGS=$RUNNER_TEMP/logs" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Prerequisite - bash 4+ (macOS ships 3.2)
        if: runner.os == 'macOS'
        run: |
          brew install bash
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"

      - name: Prerequisite - zip in Git Bash (Windows)
        if: runner.os == 'Windows'
        run: |
          MSYS=/c/msys64/usr/bin
          "$MSYS/pacman.exe" -S --noconfirm zip
          cp -n "$MSYS/zip.exe" "/c/Program Files/Git/usr/bin/zip.exe"
          for d in msys-bz2-1.dll; do [ -f "/c/Program Files/Git/usr/bin/$d" ] || cp -n "$MSYS/$d" "/c/Program Files/Git/usr/bin/"; done
          "/c/Program Files/Git/bin/bash.exe" -c 'command -v zip unzip curl'

      - run: npm ci
      - run: npm run package:tasks
      - run: mkdir -p "$LOGS"

      - name: SdkmanSetup
        run: |
          set -o pipefail
          node scripts/run-task.js sdkman-setup 2>&1 | tee "$LOGS/setup.log"
          node scripts/apply-vso.js "$LOGS/setup.log"

      - name: SdkmanInstall (java 21 + 17, maven)
        run: |
          set -o pipefail
          node scripts/run-task.js sdkman-install "candidates=java 21.0.5-tem\njava 17.0.13-tem\nmaven 3.9.9" 2>&1 | tee "$LOGS/install.log"
          node scripts/apply-vso.js "$LOGS/install.log"

      # El runner trae su propio Java y Maven: solo pasan si el PATH de SDKMAN se antepone.
      - name: Active java is 21 and maven works
        run: |
          node scripts/expect.js "java -version" "21.0.5"
          node scripts/expect.js "mvn -v" "Apache Maven 3.9.9"
          node scripts/expect.js "mvn -v" "Java version: 21.0.5"

      - name: SdkmanEnv (.sdkmanrc says java 17)
        run: |
          set -o pipefail
          node scripts/run-task.js sdkman-env sdkmanrcPath=tests/fixtures/sample/.sdkmanrc 2>&1 | tee "$LOGS/env.log"
          node scripts/apply-vso.js "$LOGS/env.log"

      - name: Active java is 17
        run: node scripts/expect.js "java -version" "17.0.13"

      - name: SdkmanRun (sdk mode)
        run: node scripts/run-task.js sdkman-run "commands=version\nhome java 21.0.5-tem" 2>&1 | tee "$LOGS/run-sdk.log"

      - name: SdkmanRun (shell mode sees the step environment)
        run: |
          set -o pipefail
          node scripts/run-task.js sdkman-run mode=shell "commands=java -version\nmvn -v\ntype sdk" 2>&1 | tee "$LOGS/run-shell.log"
          grep -q "17.0.13" "$LOGS/run-shell.log"

      - name: SdkmanInstall is idempotent
        run: |
          set -o pipefail
          node scripts/run-task.js sdkman-install "candidates=java 21.0.5-tem" 2>&1 | tee "$LOGS/idempotent.log"
          grep -q "already installed" "$LOGS/idempotent.log"

      # --- Fase 6: red, offline, versión local y ajustes de etc/config
      - name: Offline mode uses what is on disk (SDKMAN API unreachable)
        run: |
          set -o pipefail
          node scripts/run-task.js sdkman-install offline=true candidatesApi=http://127.0.0.1:1 "candidates=java 21.0.5-tem" 2>&1 | tee "$LOGS/offline.log"
          grep -q "already installed" "$LOGS/offline.log"

      - name: Offline mode refuses to download
        run: |
          if node scripts/run-task.js sdkman-install offline=true "candidates=java 11.0.25-tem" > "$LOGS/offline-fail.log" 2>&1; then echo "expected a failure"; exit 1; fi
          grep -q "offline mode is on" "$LOGS/offline-fail.log"

      - name: Permanent failures are not retried
        run: |
          if node scripts/run-task.js sdkman-install "candidates=java 99.9.9-nope" > "$LOGS/permanent.log" 2>&1; then echo "expected a failure"; exit 1; fi
          grep -q "retrying will not help" "$LOGS/permanent.log"
          ! grep -q "retrying in" "$LOGS/permanent.log"

      - name: Local folder as a candidate version
        if: runner.os != 'Windows'
        run: |
          set -o pipefail
          node scripts/run-task.js sdkman-install "candidates=java 21-local $SDKMAN_DIR/candidates/java/21.0.5-tem" 2>&1 | tee "$LOGS/local.log"
          grep -q "21-local" "$LOGS/local.log"
          test -e "$SDKMAN_DIR/candidates/java/21-local/bin"

      - name: etc/config overrides are applied during the command and restored afterwards
        run: |
          set -o pipefail
          CFG="$(cygpath -u "$SDKMAN_DIR" 2>/dev/null || echo "$SDKMAN_DIR")/etc/config"
          node scripts/run-task.js sdkman-run insecureSsl=true connectTimeout=30 mode=shell 'commands=grep -E "insecure|connect_timeout" "$SDKMAN_DIR/etc/config"' 2>&1 | tee "$LOGS/config.log"
          grep -q "sdkman_insecure_ssl=true" "$LOGS/config.log"
          grep -q "sdkman_curl_connect_timeout=30" "$LOGS/config.log"
          grep -q "sdkman_insecure_ssl=false" "$CFG"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validate-logs-${{ matrix.os }}
          path: ${{ runner.temp }}/logs
          if-no-files-found: ignore
