name: Validate tasks

on:
  push:
    branches: ["claude/**"]
    paths:
      - "src/**"
      - "scripts/**"
      - "package*.json"
      - ".github/workflows/validate-tasks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    env:
      LOGS: ${{ github.workspace }}/validate-logs
      CANDIDATES: "candidates=java 21.0.5-tem%0Amaven 3.9.9"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Prepare helper scripts
        run: |
          mkdir -p "$LOGS"
          # Applies ##vso lines from a captured log like the Azure agent would.
          cat > "$RUNNER_TEMP/apply-vso.sh" <<'SH'
          #!/usr/bin/env bash
          # usage: apply-vso.sh <logfile>
          log="$1"
          while IFS= read -r line; do
            line="${line%$'\r'}"
            case "$line" in
              "##vso[task.setvariable "*)
                name=$(printf '%s' "$line" | sed -n 's/^##vso\[task\.setvariable [^]]*variable=\([^;]*\)[^]]*\].*/\1/p')
                value=$(printf '%s' "$line" | sed -n 's/^##vso\[task\.setvariable [^]]*\]\(.*\)$/\1/p')
                if [ -n "$name" ]; then echo "setvariable $name=$value"; echo "$name=$value" >> "$GITHUB_ENV"; fi ;;
              "##vso[task.prependpath]"*)
                value="${line#'##vso[task.prependpath]'}"
                echo "prependpath $value"; echo "$value" >> "$GITHUB_PATH" ;;
            esac
          done < "$log"
          SH
          sed -i 's/^          //' "$RUNNER_TEMP/apply-vso.sh"
          chmod +x "$RUNNER_TEMP/apply-vso.sh"

      - name: Diagnostics (before)
        continue-on-error: false
        run: |
          {
          echo "== uname"; uname -a; uname -s
          echo "== bash --version"; bash --version | head -1
          for t in bash zip unzip curl git java mvn; do echo "== which -a $t"; which -a $t || echo "(not found)"; done
          echo "== command -v zip unzip curl"; bash -c 'command -v zip unzip curl' || echo "(some missing, rc=$?)"
          if [ "$RUNNER_OS" = "macOS" ]; then
            echo "== candidate bashes"
            for b in /bin/bash /usr/bin/bash /opt/homebrew/bin/bash /usr/local/bin/bash; do
              if [ -x "$b" ]; then echo "$b: $("$b" -c 'echo $BASH_VERSION')"; else echo "$b: absent"; fi
            done
            echo "== brew"; command -v brew || echo "no brew"
          fi
          if [ "$RUNNER_OS" = "Windows" ]; then
            echo "== where bash"; cmd //c "where bash" || true
            GB='C:\Program Files\Git\bin\bash.exe'
            if [ -f "/c/Program Files/Git/bin/bash.exe" ]; then
              echo "Git Bash exists at $GB"
              "/c/Program Files/Git/bin/bash.exe" -c 'echo "uname -s: $(uname -s)"; echo "BASH_VERSION=$BASH_VERSION"; echo "-- command -v zip unzip curl"; command -v zip unzip curl; echo "rc=$?"; for t in zip unzip curl; do command -v $t >/dev/null && echo "$t: yes" || echo "$t: NO"; done; echo "cygpath: $(cygpath -u "C:\\Windows")"'
            else
              echo "Git Bash NOT FOUND at $GB"
            fi
            echo "== msys2"; ls /c/msys64/usr/bin/zip.exe /c/msys64/usr/bin/unzip.exe /c/msys64/usr/bin/pacman.exe 2>&1 || true
          fi
          } 2>&1 | tee "$LOGS/diag-before.log"

      - name: Install and bundle
        run: |
          npm ci
          npm run package:tasks

      - name: SdkmanSetup
        id: setup
        continue-on-error: true
        run: |
          set -o pipefail
          node scripts/run-task.js sdkman-setup 2>&1 | tee "$LOGS/setup.log"

      - name: SdkmanInstall (java 21 + maven)
        id: install
        continue-on-error: true
        run: |
          set -o pipefail
          node scripts/run-task.js sdkman-install "$CANDIDATES" 2>&1 | tee "$LOGS/install.log"

      - name: Apply exports from install log
        id: apply
        if: always() && steps.install.outcome == 'success'
        run: |
          set -o pipefail
          "$RUNNER_TEMP/apply-vso.sh" "$LOGS/install.log" 2>&1 | tee "$LOGS/apply.log"

      - name: Verify java
        id: verify_java
        if: always() && steps.apply.outcome == 'success'
        continue-on-error: true
        run: node scripts/expect.js "java -version" "21.0.5" 2>&1 | tee "$LOGS/verify-java.log"

      - name: Verify maven
        id: verify_mvn
        if: always() && steps.apply.outcome == 'success'
        continue-on-error: true
        run: node scripts/expect.js "mvn -v" "Apache Maven 3.9.9" 2>&1 | tee "$LOGS/verify-mvn.log"

      # ---- Windows only: if the first attempt failed, install zip/unzip from the runner's MSYS2 and retry ----
      - name: "Windows retry: install zip/unzip into Git Bash"
        id: winfix
        if: >-
          always() && runner.os == 'Windows' &&
          (steps.setup.outcome == 'failure' || steps.install.outcome == 'failure' ||
           steps.verify_java.outcome == 'failure' || steps.verify_mvn.outcome == 'failure')
        continue-on-error: true
        run: |
          {
          MSYS=/c/msys64/usr/bin
          GIT=/c/Program\ Files/Git/usr/bin
          ls "$MSYS/pacman.exe" || echo "no msys2 pacman"
          "$MSYS/pacman.exe" -S --noconfirm zip unzip || echo "pacman rc=$?"
          ls -l "$MSYS/zip.exe" "$MSYS/unzip.exe" || true
          for f in zip.exe unzip.exe; do cp -nv "$MSYS/$f" "/c/Program Files/Git/usr/bin/$f"; done
          # supporting DLLs that Git does not ship
          for d in msys-bz2-1.dll; do [ -f "/c/Program Files/Git/usr/bin/$d" ] || cp -nv "$MSYS/$d" "/c/Program Files/Git/usr/bin/" || true; done
          "/c/Program Files/Git/bin/bash.exe" -c 'for t in zip unzip curl; do command -v $t >/dev/null && echo "$t: yes ($(command -v $t))" || echo "$t: NO"; done; zip -v | head -2; unzip -v | head -1'
          } 2>&1 | tee "$LOGS/winfix.log"

      - name: "Windows retry: SdkmanSetup"
        id: setup2
        if: always() && steps.winfix.outcome != 'skipped'
        continue-on-error: true
        run: |
          set -o pipefail
          node scripts/run-task.js sdkman-setup 2>&1 | tee "$LOGS/setup-retry.log"

      - name: "Windows retry: SdkmanInstall"
        id: install2
        if: always() && steps.winfix.outcome != 'skipped'
        continue-on-error: true
        run: |
          set -o pipefail
          node scripts/run-task.js sdkman-install "$CANDIDATES" 2>&1 | tee "$LOGS/install-retry.log"

      - name: "Windows retry: apply exports"
        id: apply2
        if: always() && steps.install2.outcome == 'success'
        run: |
          set -o pipefail
          "$RUNNER_TEMP/apply-vso.sh" "$LOGS/install-retry.log" 2>&1 | tee "$LOGS/apply-retry.log"

      - name: "Windows retry: verify java"
        id: verify_java2
        if: always() && steps.apply2.outcome == 'success'
        continue-on-error: true
        run: node scripts/expect.js "java -version" "21.0.5" 2>&1 | tee "$LOGS/verify-java-retry.log"

      - name: "Windows retry: verify maven"
        id: verify_mvn2
        if: always() && steps.apply2.outcome == 'success'
        continue-on-error: true
        run: node scripts/expect.js "mvn -v" "Apache Maven 3.9.9" 2>&1 | tee "$LOGS/verify-mvn-retry.log"

      - name: Diagnostics (after)
        if: always()
        run: |
          {
          echo "== outcomes"
          echo "setup=${{ steps.setup.outcome }} install=${{ steps.install.outcome }} apply=${{ steps.apply.outcome }} java=${{ steps.verify_java.outcome }} mvn=${{ steps.verify_mvn.outcome }}"
          echo "winfix=${{ steps.winfix.outcome }} setup2=${{ steps.setup2.outcome }} install2=${{ steps.install2.outcome }} apply2=${{ steps.apply2.outcome }} java2=${{ steps.verify_java2.outcome }} mvn2=${{ steps.verify_mvn2.outcome }}"
          echo "== env"; echo "SDKMAN_DIR=${SDKMAN_DIR:-}"; echo "JAVA_HOME=${JAVA_HOME:-}"
          echo "== ##vso lines in install logs"; grep -h '##vso' "$LOGS"/install*.log 2>/dev/null || true
          } 2>&1 | tee "$LOGS/diag-after.log"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validate-logs-${{ matrix.os }}
          path: validate-logs
          if-no-files-found: warn

      - name: Gate
        if: always()
        run: |
          ok_first=true
          for o in "${{ steps.setup.outcome }}" "${{ steps.install.outcome }}" "${{ steps.verify_java.outcome }}" "${{ steps.verify_mvn.outcome }}"; do [ "$o" = success ] || ok_first=false; done
          echo "first attempt passed: $ok_first"
          if [ "$ok_first" = true ]; then exit 0; fi
          echo "FIRST ATTEMPT FAILED"
          if [ "${{ steps.winfix.outcome }}" != skipped ]; then
            echo "retry after zip/unzip install: setup2=${{ steps.setup2.outcome }} install2=${{ steps.install2.outcome }} java2=${{ steps.verify_java2.outcome }} mvn2=${{ steps.verify_mvn2.outcome }}"
          fi
          exit 1
